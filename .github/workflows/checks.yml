name: Build and test
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'qa/**'
      - 'releases/**'
      - 'tools/mod-manager/docs/**'
      - 'mods/saturn-atlas/qa/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Atlas regression suite and builds
        working-directory: mods/saturn-atlas
        run: tests/run-local-suite.sh
      - uses: actions/upload-artifact@v4
        with:
          name: atlas
          path: |
            mods/saturn-atlas/client/build/libs/saturn-atlas-companion-0.2.0.jar
            mods/saturn-atlas/target/wasm32-wasip2/release/saturn_atlas.wasm
            mods/saturn-atlas/client/build/test-results/test/
  manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Updater transaction regression suite
        run: dotnet run --project tools/mod-manager/Tests/Saturn.Manager.Tests.csproj
      - name: Build portable Windows executable
        run: dotnet publish tools/mod-manager/Windows/Saturn.ModManager.csproj -c Release -r win-x64 --self-contained -o artifacts/manager
      - name: Native Windows startup smoke test
        timeout-minutes: 4
        shell: pwsh
        run: scripts/windows-smoke.ps1
      - name: Native Windows dark system preference smoke test
        timeout-minutes: 4
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $key -Force | Out-Null
          $old = (Get-Item -Path $key).GetValue('AppsUseLightTheme', $null)
          try {
            Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value 0 -Type DWord
            scripts/windows-smoke.ps1 -EvidenceName ui-evidence-dark
          } finally {
            if ($null -eq $old) { Remove-ItemProperty -Path $key -Name AppsUseLightTheme -ErrorAction SilentlyContinue }
            else { Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value $old -Type DWord }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-manager
          path: |
            artifacts/manager/Saturn-Mod-Manager.exe
            artifacts/manager/windows-smoke.*
            artifacts/manager/ui-evidence/
            artifacts/manager/ui-evidence-dark/
            test-results.txt
